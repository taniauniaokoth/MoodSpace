<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>Mood|MoodSpace</title>
  </head>
  <body>
    <!-- the header -->
    <header>
      <h1><a href="index.html">MOOD SPACE</a></h1>
      <h2>Your safe space to <span>feel everything</span></h2>
      <nav>
        <a href="about.html">About</a>
        <a href="mood.html">Add Mood</a>
        <a href="result.html">Results</a>
      </nav>
    </header>

    <!-- the main section  -->
    <main>
      <section class="tips">
        <h2>Quick Tips</h2>
        <ul>
          <li>Be honest — this space is for you only.</li>
          <li>Write even one word if you're unsure.</li>
          <li>Consistency matters more than perfection.</li>
        </ul>
      </section>

      <section class="mood-preview">
        <h2>Selected Mood</h2>
        <p id="previewText">Nothing selected yet</p>
      </section>

      <section class="form-section">
        <!-- user's form  -->
        <form id="moodForm">
          <label>How are you feeling today?</label>
          <select id="mood">
            <option value="">Select your mood</option>
            <option id="happy" value="Happy">Happy</option>
            <option id="sad" value="Sad">Sad</option>
            <option id="angry" value="Angry">Angry</option>
            <option id="excited" value="Excited">Excited</option>
            <option id="tired" value="Tired">Tired</option>
          </select>

          <label>note</label>
          <textarea id="note" placeholder="Pour your heart"></textarea>

          <button type="button" onclick="saveMood()">Save Mood</button>
        </form>

        <p id="message"></p>
      </section>

      <footer>
        <p>Your feelings matter 🤍</p>
      </footer>
    </main>

    <div class="cursor"></div>
    <script src="script.js"></script>
  </body>
</html>
